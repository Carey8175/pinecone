# Modified for pinecone desktop; see NOTICE.
name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run prepare:resources
      - run: bun run build:foundation
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:studio
      - run: bun run rebuild:native
